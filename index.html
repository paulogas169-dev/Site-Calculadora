
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meanly — Calculadora de Média</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="pagina">

        <section class="card">

            <div class="topo">

                <div class="logo">
                    M
                </div>

                <div>
                    <span class="mini-titulo">MEANLY</span>
                    <h1>Calculadora de média</h1>
                </div>

            </div>

            <p class="descricao">
                Insira suas notas e descubra seu desempenho acadêmico.
            </p>


            <div class="linha"></div>


            <div class="notas">

                <div class="campo">
                    <label for="nota1">Nota 01</label>
                    <input
                        type="number"
                        id="nota1"
                        min="0"
                        max="10"
                        step="0.1"
                        placeholder="0,0"
                    >
                </div>

                <div class="campo">
                    <label for="nota2">Nota 02</label>
                    <input
                        type="number"
                        id="nota2"
                        min="0"
                        max="10"
                        step="0.1"
                        placeholder="0,0"
                    >
                </div>

                <div class="campo">
                    <label for="nota3">Nota 03</label>
                    <input
                        type="number"
                        id="nota3"
                        min="0"
                        max="10"
                        step="0.1"
                        placeholder="0,0"
                    >
                </div>

                <div class="campo">
                    <label for="nota4">Nota 04</label>
                    <input
                        type="number"
                        id="nota4"
                        min="0"
                        max="10"
                        step="0.1"
                        placeholder="0,0"
                    >
                </div>

            </div>


            <button onclick="calcularMedia()">
                Calcular média
                <span>→</span>
            </button>


            <div id="resultado">

                <span class="resultado-label">
                    SUA MÉDIA
                </span>

                <strong>—</strong>

            </div>


            <p class="rodape">
                Média calculada com base nas 4 notas informadas.
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
